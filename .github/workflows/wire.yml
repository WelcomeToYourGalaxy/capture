name: harvest wire

on:
  schedule:
    - cron: "17 */3 * * *"      # every three hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install feedparser
      - run: python harvest_wire.py
      - name: commit wire.json
        run: |
          git config user.name  "wire-bot"
          git config user.email "wire-bot@users.noreply.github.com"
          git add wire.json
          git diff --staged --quiet || git commit -m "wire: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
